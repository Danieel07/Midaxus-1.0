<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Midaxus</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>

    <div class="login-container">
        
        <header class="login-header">
            <div class="login-logo-wrapper">
                <img src="/img/midaxus_icon.png" alt="Midaxus" class="login-logo">
            </div>
            <h1 class="login-title">midaxus</h1>
            <p id="login-role-subtitle" class="login-subtitle">Ingresa tus credenciales para continuar</p>
        </header>

        <main class="login-card">
            <form id="loginForm">
                
                <div class="form-group">
                    <label class="form-label" for="email">Usuario / Correo</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user input-icon"></i>
                        <input type="email" id="email" name="email" required placeholder="nombre@ejemplo.com" class="form-input">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" name="password" required placeholder="••••••••" class="form-input">
                    </div>
                </div>

                <button type="submit" id="login-submit-btn" class="btn-submit">
                    <span>Iniciar Sesión</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>
        </main>

        <footer class="login-footer">
            <a href="/forgotpassword" class="login-link">¿Olvidaste tu contraseña?</a>
            <span class="separator">|</span>
            <a href="/register" class="login-link">Crear cuenta</a>
        </footer>

    </div>

    <!-- Scripts remain functional -->
    <script src="/js/login.js"></script>
</body>
</html>
