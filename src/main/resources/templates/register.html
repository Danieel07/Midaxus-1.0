<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Midaxus</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>

    <div class="login-container">
        
        <header class="login-header">
            <div class="login-logo-wrapper">
                <img src="/img/midaxus_icon.png" alt="Midaxus" class="login-logo">
            </div>
            <h1 class="login-title">midaxus</h1>
            <p class="login-subtitle">Crea tu cuenta institucional para comenzar</p>
        </header>

        <main class="login-card">
            <form id="registerForm">
                
                <div class="form-group">
                    <label class="form-label" for="name">Nombre Completo</label>
                    <div class="input-wrapper">
                        <i class="fas fa-id-card input-icon"></i>
                        <input type="text" id="name" name="name" required placeholder="Tu nombre y apellido" class="form-input">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Correo Electrónico</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="email" name="email" required placeholder="nombre@ejemplo.com" class="form-input">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" name="password" required placeholder="••••••••" class="form-input">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Confirmar Contraseña</label>
                    <div class="input-wrapper">
                        <i class="fas fa-shield-alt input-icon"></i>
                        <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="••••••••" class="form-input">
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    <span>Crear cuenta</span>
                    <i class="fas fa-user-plus"></i>
                </button>
            </form>
        </main>

        <footer class="login-footer">
            <a href="/login" class="login-link">¿Ya tienes una cuenta? Inicia sesión</a>
        </footer>

    </div>

    <script src="/js/register.js"></script>
</body>
</html>
