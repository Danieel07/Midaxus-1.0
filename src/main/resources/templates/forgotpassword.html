<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - Midaxus</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/login.css">
    <style>
        .step { display: none; }
        .step.active { display: block; }
        .success-icon {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 1.5rem;
        }
    </style>
</head>

<body>
    <div class="login-container">
        
        <header class="login-header">
            <div class="login-logo-wrapper">
                <img src="/img/midaxus_icon.png" alt="Midaxus" class="login-logo">
            </div>
            <h1 class="login-title">midaxus</h1>
        </header>

        <main class="login-card">
            <!-- Step 1: Ingresar correo -->
            <div id="step-email" class="step active">
                <p class="login-subtitle" style="margin-bottom: 2rem;">¿Olvidaste tu contraseña? Ingresa tu correo y te enviaremos un enlace para restablecerla.</p>
                <form id="emailForm">
                    <div class="form-group">
                        <label class="form-label" for="email">Correo Electrónico</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" id="email" name="email" required placeholder="nombre@ejemplo.com" class="form-input">
                        </div>
                    </div>
                    <button type="submit" class="btn-submit">
                        <span>Enviar enlace</span>
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </form>
            </div>

            <!-- Step 2: Confirmación enviada -->
            <div id="step-sent" class="step" style="text-align: center;">
                <div class="success-icon">
                    <i class="fas fa-check-circle"></i>
                </div>
                <h2 style="font-size: 1.25rem; font-weight: 700; color: var(--navy); margin-bottom: 0.5rem;">Revisa tu correo</h2>
                <p class="login-subtitle" style="margin-bottom: 1.5rem;">
                    Enviamos un enlace de recuperación a <strong id="sentEmail" style="color: var(--navy);"></strong>. Revisa tu carpeta de spam si no lo ves.
                </p>
                <button type="button" class="login-link" id="resendBtn" style="background: none; border: none; font-size: 0.875rem; cursor: pointer;">
                    ¿No llegó? Intentar de nuevo
                </button>
            </div>
        </main>

        <footer class="login-footer">
            <a href="/login" class="login-link">← Volver a Iniciar Sesión</a>
        </footer>

    </div>

    <script>
        const emailForm = document.getElementById('emailForm');
        const stepEmail = document.getElementById('step-email');
        const stepSent = document.getElementById('step-sent');
        const sentEmail = document.getElementById('sentEmail');
        const resendBtn = document.getElementById('resendBtn');

        function notify(msg, type = "info") {
            alert(msg); 
        }

        emailForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            if (!email) return;

            try {
                const response = await fetch("/auth/forgot-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: email })
                });

                const data = await response.json();
                if (!data.success) {
                    notify(data.message, "error");
                    return;
                }

                sentEmail.textContent = email;
                stepEmail.classList.remove("active");
                stepSent.classList.add("active");

            } catch (err) {
                console.error(err);
                notify("Error en el servidor", "error");
            }
        });

        resendBtn.addEventListener("click", () => {
            stepSent.classList.remove('active');
            stepEmail.classList.add('active');
        });
    </script>
</body>
</html>
